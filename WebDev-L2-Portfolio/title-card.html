<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Title Card - Task 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
            color: #f9fafb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .card {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            padding: 4.5rem 3rem;
            border-radius: 1.5rem;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        .org-badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.35);
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }
        .name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.25rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .details {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin-top: 1.75rem;
            padding-top: 1.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .detail-item {
            text-align: center;
        }
        .detail-label {
            font-size: 0.85rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.75px;
            margin-bottom: 0.35rem;
        }
        .detail-val {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="org-badge">Oasis Infobyte Internship (OIBSIP)</span>
        <h1 class="name">Avishka Kesarwani</h1>
        <div class="details">
            <div class="detail-item">
                <div class="detail-label">Track</div>
                <div class="detail-val">Web Development</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Task</div>
                <div class="detail-val">Task 2 · Personal Portfolio</div>
            </div>
        </div>
    </div>
</body>
</html>
